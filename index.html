<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Random Photo</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    img {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    img.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <img id="photo" />

  <script>
    const img = document.getElementById("photo");

    async function loadImage() {
      try {
        // fade out before loading new image
        img.classList.remove("show");

        const res = await fetch("https://api.bonjourr.fr/unsplash/photos/random");
        const data = await res.json();

        const url =
          data?.urls?.full ||
          data?.urls?.regular ||
          data?.urls?.small;

        // wait a tiny bit so fade-out is visible
        setTimeout(() => {
          img.src = url;
        }, 300);

        img.onload = () => img.classList.add("show");

      } catch (e) {
        console.error("Failed to load image", e);
      }
    }

    loadImage();
    setInterval(loadImage, 2 * 60 * 1000); // every 2 minutes
  </script>
</body>
</html>
